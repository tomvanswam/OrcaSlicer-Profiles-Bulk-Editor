<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OrcaSlicer Profiles</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f1f3f6; --border: #e3e6eb;
  --text: #1b1f24; --muted: #667080; --accent: #0f766e; --accent-soft: #e6f4f2;
  /* Okabe-Ito colours (safe for colour vision deficiency), darkened for text contrast */
  --own: #a35a00; --own-soft: #fdf0dc; --parent: #a3407c; --parent-soft: #f8e9f2;
  --system: #005f96; --system-soft: #e1eff8; --warn: #b45309; --warn-soft: #fff7e6;
  --shadow: 0 1px 2px rgb(16 24 40 / .05), 0 1px 3px rgb(16 24 40 / .06);
  --radius: 10px;
  --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216; --panel: #161a20; --panel-2: #1c2129; --border: #2a303a;
    --text: #e6e9ee; --muted: #8b95a5; --accent: #2dd4bf; --accent-soft: #12302d;
    --own: #f0b13a; --own-soft: #3a2a10; --parent: #e09ac4; --parent-soft: #3a2131;
    --system: #56b4e9; --system-soft: #10293a; --warn: #fbbf24; --warn-soft: #3a2c0f;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 14px/1.45 "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  display: grid; grid-template-rows: auto 1fr;
}
header {
  display: flex; align-items: center; gap: 12px; padding: 12px 20px;
  background: var(--panel); border-bottom: 1px solid var(--border);
}
header .logo {
  width: 28px; height: 28px; border-radius: 8px; background: var(--accent);
  display: grid; place-items: center; color: var(--panel); font-weight: 700;
}
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
header .count { color: var(--muted); margin-left: auto; font-size: 13px; }
.layout { display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
aside {
  background: var(--panel); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; min-height: 0;
}
.filters { padding: 14px; display: grid; gap: 10px; border-bottom: 1px solid var(--border); }
input[type=search] {
  width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--panel-2); color: var(--text); font: inherit; outline: none;
}
input[type=search]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.seg { display: flex; background: var(--panel-2); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button {
  flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px;
  padding: 5px 8px; border-radius: 6px; cursor: pointer;
}
.seg button.on { background: var(--panel); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }
.toggle { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--accent); }
.list { overflow: auto; flex: 1; padding: 6px 8px 16px; }
.group { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 12px 8px 4px; }
.item {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 7px;
  cursor: pointer; color: var(--text);
}
.item:hover { background: var(--panel-2); }
.item.sel { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.ico { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -2px; }
.ico.user { color: var(--parent); } .ico.system { color: var(--system); } .ico.own { color: var(--own); }
.item .hidden-tag { font-size: 11px; color: var(--muted); }
main { overflow: auto; padding: 24px 28px 48px; min-width: 0; }
.empty { color: var(--muted); display: grid; place-items: center; height: 70%; text-align: center; }
.title-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.title-row h2 { margin: 0; font-size: 22px; font-weight: 650; }
.pill {
  font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--panel-2);
  color: var(--muted); border: 1px solid var(--border);
}
.path { color: var(--muted); font-family: var(--mono); font-size: 12px; margin-top: 4px; word-break: break-all; }
section { margin-top: 24px; }
section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
.chain { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding-bottom: 4px; }
.node {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px 14px; min-width: 170px; max-width: 260px; box-shadow: var(--shadow);
  cursor: pointer; transition: border-color .15s, transform .15s;
}
.node:hover { border-color: var(--accent); transform: translateY(-1px); }
.node.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.node .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node .m { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; margin-top: 3px; }
.node .n { display: flex; gap: 6px; align-items: center; }
.node.self { border-top: 3px solid var(--own); }
.node.user { border-top: 3px dashed var(--parent); }
.node.system { border-top: 3px dotted var(--system); }
.arrow { display: grid; place-items: center; color: var(--muted); padding: 0 8px; font-size: 18px; }
.warn { margin-top: 10px; background: var(--warn-soft); color: var(--warn); padding: 8px 12px; border-radius: 8px; font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px 14px; cursor: pointer; box-shadow: var(--shadow); text-align: left; font: inherit; color: inherit;
}
.stat .v { font-size: 22px; font-weight: 650; }
.stat .l { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.stat.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.toolbar input[type=search] { max-width: 320px; }
.toolbar .shown { color: var(--muted); font-size: 13px; margin-left: auto; }
table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--panel-2); padding: 9px 14px; border-bottom: 1px solid var(--border); position: sticky; top: 0; }
td { padding: 8px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--panel-2); }
td.key { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
td.val { font-family: var(--mono); font-size: 13px; word-break: break-word; max-width: 420px; }
td.from { color: var(--muted); font-size: 13px; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.badge.own { background: var(--own-soft); color: var(--own); }
.badge.parent { background: var(--parent-soft); color: var(--parent); }
.badge.system { background: var(--system-soft); color: var(--system); }
.diff { display: inline-flex; align-items: center; gap: 3px; color: var(--text); font-size: 12px; font-weight: 600; margin-left: 8px; }
.diff .ico { stroke-width: 2.4; }
tr.hist td { background: var(--panel-2); padding: 0 14px 10px; border-bottom: 1px solid var(--border); }
.hist-list { display: grid; gap: 4px; padding: 8px 0 0 12px; border-left: 2px solid var(--border); margin-left: 4px; }
.hist-list div { font-size: 13px; display: flex; gap: 12px; }
.hist-list code { font-family: var(--mono); }
.hist-list span { color: var(--muted); }
.legend { display: flex; gap: 16px; color: var(--muted); font-size: 12px; margin-top: 10px; flex-wrap: wrap; }
.act { display: flex; gap: 4px; justify-content: flex-end; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--panel);
  color: var(--text); font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 7px; cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.icon { padding: 4px 6px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); font-weight: 600; }
.editor { display: grid; gap: 10px; padding: 12px 0 4px; }
.editor .row2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.editor select, .editor input[type=text] {
  padding: 6px 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel);
  color: var(--text); font: inherit;
}
.editor input[type=text] { font-family: var(--mono); font-size: 13px; flex: 1; min-width: 220px; }
.editor .hint { color: var(--muted); font-size: 12px; }
.pending-mark { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--accent); margin-left: 8px; }
.bar {
  position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 5;
  background: var(--panel); border: 1px solid var(--accent); border-radius: 12px; box-shadow: 0 8px 24px rgb(0 0 0 / .18);
  padding: 10px 12px 10px 16px; display: flex; gap: 12px; align-items: center;
}
.modal-bg { position: fixed; inset: 0; background: rgb(0 0 0 / .45); display: grid; place-items: center; z-index: 10; padding: 16px; }
.modal { background: var(--panel); border-radius: 14px; max-width: 860px; width: 100%; max-height: 85vh; overflow: auto; padding: 20px 22px; border: 1px solid var(--border); }
.modal h2 { margin: 0 0 4px; font-size: 18px; }
.file { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin-top: 12px; }
.file .fn { font-weight: 600; display: flex; gap: 6px; align-items: center; }
.chg { font-family: var(--mono); font-size: 13px; display: grid; grid-template-columns: 22px minmax(140px, auto) 1fr; gap: 4px 8px; margin-top: 8px; align-items: start; }
.chg del { color: var(--muted); }
.chg ins { text-decoration: none; font-weight: 600; }
.ok { margin-top: 10px; background: var(--accent-soft); color: var(--accent); padding: 8px 12px; border-radius: 8px; font-size: 13px; }
@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; }
  aside { max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--border); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  main { padding: 16px; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-own" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
  <symbol id="i-parent" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-system" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></symbol>
  <symbol id="i-diff" viewBox="0 0 24 24"><path d="M5 9h14"/><path d="M5 15h14"/><path d="M16 4 8 20"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3 2 21h20Z"/><path d="M12 10v5"/><path d="M12 18h.01"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16Z"/><path d="m13 7 4 4"/></symbol>
  <symbol id="i-inherit" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5Z"/><path d="M8 3v5h7V3"/><path d="M8 21v-7h8v7"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
</svg>
<header>
  <div class="logo">O</div>
  <h1>OrcaSlicer Profiles</h1>
  <span class="count" id="count"></span>
</header>
<div class="layout">
  <aside>
    <div class="filters">
      <input type="search" id="q" placeholder="Search profiles…" autocomplete="off">
      <div class="seg" id="types">
        <button data-v="" class="on">All</button>
        <button data-v="filament">Filament</button>
        <button data-v="process">Process</button>
        <button data-v="machine">Printer</button>
      </div>
      <div class="seg" id="origins">
        <button data-v="" class="on">All</button>
        <button data-v="user">User</button>
        <button data-v="system">System</button>
      </div>
      <label class="toggle"><input type="checkbox" id="hidden"> Show hidden base profiles</label>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <main id="main">
    <div class="empty"><div><p style="font-size:16px">Select a profile</p><p>to see its inherits chain and where every setting comes from.</p></div></div>
  </main>
</div>
<script>
"use strict";
const S = { profiles: [], type: "", origin: "", q: "", hidden: false, sel: null,
            data: null, sources: new Set(), key: "", onlyDiff: false, focus: null, open: new Set(),
            editing: null, pending: new Map() };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmt = (v) => typeof v === "string" ? v : JSON.stringify(v);
const LABEL = { own: "Own", parent: "Parent", system: "System" };
const ICON = { own: "own", parent: "parent", system: "system", user: "parent" };
const icon = (name, cls = "") => `<svg class="ico ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const DIFF = `<span class="diff" title="Differs from the inherited value">${icon("diff")}changed</span>`;
const TYPE_LABEL = { filament: "Filament", process: "Process", machine: "Printer" };

async function api(path, payload) {
  const r = await fetch(path, payload === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
  const body = await r.json();
  if (!r.ok) throw new Error(body.error || r.statusText);
  return body;
}

function segment(id, key) {
  $(id).addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    for (const x of $(id).children) x.classList.toggle("on", x === b);
    S[key] = b.dataset.v; renderList();
  });
}

function renderList() {
  const q = S.q.toLowerCase();
  const items = S.profiles.filter((p) =>
    (!S.type || p.type === S.type) && (!S.origin || p.origin === S.origin) &&
    (S.hidden || p.instantiable || p.origin === "user") && p.name.toLowerCase().includes(q));
  const groups = {};
  for (const p of items) (groups[`${TYPE_LABEL[p.type]} · ${p.origin === "user" ? "User" : (p.vendor || "System")}`] ??= []).push(p);
  const keys = Object.keys(groups).sort((a, b) => (a.includes("User") ? 0 : 1) - (b.includes("User") ? 0 : 1) || a.localeCompare(b));
  $("list").innerHTML = keys.map((g) => `<div class="group">${esc(g)} · ${groups[g].length}</div>` +
    groups[g].map((p) => `<div class="item${S.sel && S.sel.path === p.path ? " sel" : ""}" data-path="${esc(p.path)}">
      ${icon(ICON[p.origin], p.origin)}<span class="name" title="${esc(p.name)}">${esc(p.name)}</span>
      ${p.instantiable ? "" : '<span class="hidden-tag">base</span>'}</div>`).join("")).join("")
    || '<div class="group">No profiles match</div>';
}

async function select(p) {
  S.sel = p; S.focus = null; S.open.clear(); S.editing = null;
  location.hash = encodeURIComponent(`${p.type}/${p.name}`);
  renderList();
  try {
    S.data = await api(`/api/chain?${new URLSearchParams({ name: p.name, type: p.type, path: p.path })}`);
    renderMain();
  } catch (err) {
    $("main").innerHTML = `<div class="warn">${esc(err.message)}</div>`;
  }
}

function nodeClass(n, i) { return i === 0 ? "self" : n.origin; }

function renderMain() {
  const d = S.data, p = d.profile;
  const all = Object.entries(d.settings);
  const counts = { own: 0, parent: 0, system: 0 };
  for (const [, s] of all) counts[s.source]++;
  const key = S.key.toLowerCase();
  const rows = all.filter(([k, s]) =>
    (!S.sources.size || S.sources.has(s.source)) && (!key || k.toLowerCase().includes(key)) &&
    (!S.onlyDiff || s.differs) && (!S.focus || s.from === S.focus));

  $("main").innerHTML = `
    <div class="title-row"><h2>${esc(p.name)}</h2>
      <span class="pill">${TYPE_LABEL[p.type]}</span><span class="pill">${p.origin === "user" ? "User" : "System · " + esc(p.vendor || "")}</span></div>
    <div class="path">${esc(p.path)}</div>
    <section><h3>Inherits chain</h3>
      <div class="chain">${d.chain.map((n, i) => `${i ? '<div class="arrow">→</div>' : ""}
        <div class="node ${nodeClass(n, i)}${S.focus === n.name ? " active" : ""}" data-name="${esc(n.name)}" title="Click to show only settings taken from this profile">
          <div class="n" title="${esc(n.name)}">${i === 0 ? icon("own", "own") : icon(ICON[n.origin], n.origin)}<span style="overflow:hidden;text-overflow:ellipsis">${esc(n.name)}</span></div>
          <div class="m">${i === 0 ? "this profile" : n.origin === "user" ? "user parent" : "system · " + esc(n.vendor || "")} · ${n.own_settings} settings</div>
        </div>`).join("")}</div>
      ${d.warnings.map((w) => `<div class="warn">${icon("warn")} ${esc(w)}</div>`).join("")}
    </section>
    <section><h3>Settings</h3>
      <div class="stats">
        <button class="stat${!S.sources.size ? " on" : ""}" data-src=""><div class="v">${all.length}</div><div class="l">Total effective</div></button>
        ${["own", "parent", "system"].map((k) => `<button class="stat${S.sources.has(k) ? " on" : ""}" data-src="${k}">
          <div class="v">${counts[k]}</div><div class="l"><span class="badge ${k}">${icon(k)}${LABEL[k]}</span></div></button>`).join("")}
      </div>
    </section>
    <section>
      <div class="toolbar">
        <input type="search" id="key" placeholder="Filter settings…" value="${esc(S.key)}" autocomplete="off">
        <label class="toggle"><input type="checkbox" id="diff"${S.onlyDiff ? " checked" : ""}> Only values that differ from parent</label>
        <span class="shown">${rows.length} of ${all.length} shown${S.focus ? ` · from <b>${esc(S.focus)}</b>` : ""}</span>
      </div>
      <table><thead><tr><th>Setting</th><th>Value</th><th>Source</th><th>Defined in</th><th></th></tr></thead><tbody>
      ${rows.map(([k, s]) => `<tr class="row" data-key="${esc(k)}">
          <td class="key">${s.overrides.length ? (S.open.has(k) ? "▾ " : "▸ ") : "&nbsp;&nbsp;"}${esc(k)}</td>
          <td class="val">${esc(fmt(s.value))}</td>
          <td><span class="badge ${s.source}">${icon(s.source)}${LABEL[s.source]}</span>${s.differs ? DIFF : ""}</td>
          <td class="from">${s.source === "own" ? "—" : esc(s.from)}${pendingFor(k) ? `<span class="pending-mark" title="Unsaved change">${icon("edit")}${pendingFor(k)} pending</span>` : ""}</td>
          <td><div class="act">
            <button class="btn icon" data-act="edit" title="Change this setting (at any level of the chain)">${icon("edit")}</button>
            <button class="btn icon" data-act="inherit" title="Inherit: remove the override from this profile"${s.source === "own" && s.overrides.length ? "" : " disabled"}>${icon("inherit")}</button>
          </div></td></tr>
        ${S.editing === k ? editorRow(k, s) : ""}
        ${S.open.has(k) && s.overrides.length ? `<tr class="hist"><td colspan="5"><div class="hist-list">
          ${s.overrides.map((o) => `<div><span>overrides</span><code>${esc(fmt(o.value))}</code><span>from ${esc(o.from)}</span></div>`).join("")}
          </div></td></tr>` : ""}`).join("")}
      </tbody></table>
      <div class="legend"><span>${icon("own", "own")} Own: set in this profile</span><span>${icon("parent", "user")} Parent: from your own parent profile</span><span>${icon("system", "system")} System: from a vendor profile</span><span>${DIFF.replace('margin-left: 8px', '')} value differs from what it would inherit</span><span>▸ click a row to see the values it overrides</span><span>${icon("edit")} change a value at any level</span><span>${icon("inherit")} inherit: drop the override</span></div>
    </section>${pendingBar()}`;

  const keyInput = $("key");
  keyInput.addEventListener("input", (e) => { S.key = e.target.value; renderMain(); const k = $("key"); k.focus(); k.setSelectionRange(k.value.length, k.value.length); });
  $("diff").addEventListener("change", (e) => { S.onlyDiff = e.target.checked; renderMain(); });
}


// ---- editing -------------------------------------------------------------------------
// Every chain profile that defines key ``k`` itself, nearest first.
const definers = (s) => [s.from, ...s.overrides.map((o) => o.from)];
function valueAt(s, name) {
  if (s.from === name) return s.value;
  const o = s.overrides.find((x) => x.from === name); return o ? o.value : undefined;
}
function pendingFor(k) {
  let n = 0; for (const e of S.pending.values()) if (k in e.set || e.inherit.has(k)) n++; return n;
}
function queue(path, name, key, value) {
  const e = S.pending.get(path) ?? { name, set: {}, inherit: new Set() };
  delete e.set[key]; e.inherit.delete(key);
  if (value === undefined) e.inherit.add(key); else e.set[key] = value;
  S.pending.set(path, e);
}
function editorRow(k, s) {
  const defs = new Set(definers(s));
  const opts = S.data.chain.map((n, i) => `<option value="${i}">${i === 0 ? "This profile" : n.origin === "user" ? "User parent" : "System"} · ${esc(n.name)}${defs.has(n.name) ? " (defines it)" : ""}</option>`).join("");
  return `<tr class="hist"><td colspan="5"><div class="editor" data-key="${esc(k)}">
    <div class="row2"><label class="hint" for="lvl">Change in</label><select id="lvl">${opts}</select></div>
    <div class="row2"><input type="text" id="val" value="${esc(fmt(s.value))}" spellcheck="false">
      <button class="btn primary" data-act="queue-set">${icon("edit")}Set value</button>
      <button class="btn" data-act="queue-inherit" id="inh">${icon("inherit")}Inherit at this level</button>
      <button class="btn" data-act="cancel">${icon("x")}Cancel</button></div>
    <div class="hint" id="lvlhint"></div>
  </div></td></tr>`;
}
function syncEditor() {
  const ed = document.querySelector(".editor"); if (!ed) return;
  const s = S.data.settings[ed.dataset.key], n = S.data.chain[+$("lvl").value];
  const own = valueAt(s, n.name);
  $("inh").disabled = own === undefined || n.name === definers(s).at(-1);
  $("lvlhint").innerHTML = (own === undefined ? `Not set in ${esc(n.name)} yet; setting it adds an override there.` : `Currently ${esc(fmt(own))} in ${esc(n.name)}.`) +
    (n.origin === "system" ? ` ${icon("warn")} System profiles are overwritten when OrcaSlicer updates its profiles.` : "") +
    " Plain values are stored like the existing one (e.g. 220 becomes [\"220\"] for list settings).";
}
function pendingBar() {
  let n = 0; for (const e of S.pending.values()) n += Object.keys(e.set).length + e.inherit.size;
  return n ? `<div class="bar"><b>${n} unsaved change${n > 1 ? "s" : ""}</b> in ${S.pending.size} profile${S.pending.size > 1 ? "s" : ""}
    <button class="btn" data-act="discard">${icon("x")}Discard</button>
    <button class="btn primary" data-act="review">${icon("save")}Review &amp; save</button></div>` : "";
}
const editsBody = (apply) => ({ apply, edits: [...S.pending].map(([path, e]) => ({ path, set: e.set, inherit: [...e.inherit] })) });
async function review() {
  let res; try { res = await api("/api/edit", editsBody(false)); } catch (err) { return alert(err.message); }
  const files = res.edits.filter((e) => e.changes.length || e.warnings.length);
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h2>Review changes</h2>
    <div class="hint" style="color:var(--muted)">Each file is backed up before it is written.</div>
    ${files.map((e) => `<div class="file"><div class="fn">${icon(ICON[e.profile.origin], e.profile.origin)}${esc(e.profile.name)} <span class="pill">${e.profile.origin}</span></div>
      <div class="path">${esc(e.profile.path)}</div>
      ${e.warnings.map((w) => `<div class="warn">${icon("warn")} ${esc(w)}</div>`).join("")}
      <div class="chg">${e.changes.map((c) => c.inherit
        ? `<span title="inherit">${icon("inherit")}</span><span>${esc(c.key)}</span><span><del>${esc(fmt(c.old))}</del> → inherit${c.inherited_from ? ` <ins>${esc(fmt(c.inherited))}</ins> from ${esc(c.inherited_from)}` : " (no parent value)"}</span>`
        : `<span title="set">${icon("edit")}</span><span>${esc(c.key)}</span><span><del>${c.old === null ? "inherited" : esc(fmt(c.old))}</del> → <ins>${esc(fmt(c.new))}</ins></span>`).join("") || '<span></span><span class="hint">no changes</span>'}</div></div>`).join("")}
    <div class="row2" style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button class="btn" data-m="close">Back</button>
      <button class="btn primary" data-m="save">${icon("save")}Save ${files.filter((e) => e.changes.length).length} file(s)</button></div>
    <div id="mres"></div></div>`;
  document.body.append(bg);
  bg.addEventListener("click", async (e) => {
    const b = e.target.closest("button");
    if (e.target === bg || b?.dataset.m === "close") return bg.remove();
    if (b?.dataset.m !== "save") return;
    b.disabled = true;
    try {
      const r = await api("/api/edit", editsBody(true));
      S.pending.clear();
      bg.querySelector("#mres").innerHTML = `<div class="ok">Saved. Backups:<br>${r.backups.map(esc).join("<br>")}</div>`;
      bg.querySelector('[data-m="close"]').textContent = "Close";
      S.profiles = (await api("/api/profiles")).profiles;
      const cur = S.profiles.find((x) => x.path === S.sel.path); if (cur) await select(cur);
    } catch (err) { bg.querySelector("#mres").innerHTML = `<div class="warn">${esc(err.message)}</div>`; b.disabled = false; }
  });
}
$("main").addEventListener("change", (e) => { if (e.target.id === "lvl") syncEditor(); });
$("main").addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act) {
    const k = e.target.closest("tr")?.dataset.key ?? e.target.closest(".editor")?.dataset.key, s = k && S.data.settings[k];
    if (act === "edit") { S.editing = S.editing === k ? null : k; renderMain(); syncEditor(); $("val")?.focus(); }
    else if (act === "inherit") { queue(S.data.profile.path, S.data.profile.name, k); renderMain(); }
    else if (act === "cancel") { S.editing = null; renderMain(); }
    else if (act === "queue-set" || act === "queue-inherit") {
      const n = S.data.chain[+$("lvl").value];
      queue(n.path, n.name, k, act === "queue-set" ? $("val").value : undefined);
      S.editing = null; renderMain();
    }
    else if (act === "discard") { S.pending.clear(); renderMain(); }
    else if (act === "review") review();
    return;
  }
  if (e.target.closest(".editor")) return;
  const stat = e.target.closest(".stat");
  if (stat) { const v = stat.dataset.src; if (!v) S.sources.clear(); else S.sources.has(v) ? S.sources.delete(v) : S.sources.add(v); renderMain(); return; }
  const node = e.target.closest(".node");
  if (node) { S.focus = S.focus === node.dataset.name ? null : node.dataset.name; renderMain(); return; }
  const row = e.target.closest("tr.row");
  if (row) { const k = row.dataset.key; S.open.has(k) ? S.open.delete(k) : S.open.add(k); renderMain(); }
});
$("list").addEventListener("click", (e) => {
  const it = e.target.closest(".item"); if (!it) return;
  const p = S.profiles.find((x) => x.path === it.dataset.path); if (p) select(p);
});
$("q").addEventListener("input", (e) => { S.q = e.target.value; renderList(); });
$("hidden").addEventListener("change", (e) => { S.hidden = e.target.checked; renderList(); });
segment("types", "type"); segment("origins", "origin");

(async () => {
  try {
    const { profiles, errors } = await api("/api/profiles");
    S.profiles = profiles;
    $("count").textContent = `${profiles.length} profiles${errors.length ? ` · ${errors.length} unreadable` : ""}`;
    renderList();
    const h = decodeURIComponent(location.hash.slice(1));
    const [t, ...rest] = h.split("/");
    const p = h && profiles.find((x) => x.type === t && x.name === rest.join("/"));
    if (p) select(p);
  } catch (err) {
    $("main").innerHTML = `<div class="warn">Could not load profiles: ${esc(err.message)}</div>`;
  }
})();
</script>
</body>
</html>
